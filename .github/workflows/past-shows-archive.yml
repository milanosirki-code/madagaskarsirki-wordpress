name: Past shows archive contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  past-shows-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: php tests/past-shows-archive/contract.php
