name: Build MMC school deployment ZIPs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wp-content/plugins/madagaskar-management-center/**'
      - 'wp-content/plugins/madagaskar-okul-tanitim/**'
      - '.github/workflows/build-mmc-school-deploy-zips.yml'
  push:
    branches:
      - main
    paths:
      - 'wp-content/plugins/madagaskar-management-center/**'
      - 'wp-content/plugins/madagaskar-okul-tanitim/**'
      - '.github/workflows/build-mmc-school-deploy-zips.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: 156ee22a658310e0426fedfd8eee0d84265cc0f4
          path: rollback-src

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, zip, simplexml, dom
          coverage: none

      - name: Lint school plugins
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/madagaskar-management-center -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          find wp-content/plugins/madagaskar-okul-tanitim -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: School records functional tests
        run: php tests/schools/records-functional.php

      - name: Build installable plugin ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy .package
          mkdir -p deploy .package

          cp -R wp-content/plugins/madagaskar-management-center .package/madagaskar-management-center
          cp -R wp-content/plugins/madagaskar-okul-tanitim .package/madagaskar-okul-tanitim

          (cd .package && zip -qr ../deploy/madagaskar-management-center-1.3.48.zip madagaskar-management-center)
          (cd .package && zip -qr ../deploy/madagaskar-okul-tanitim-1.8.4.zip madagaskar-okul-tanitim)

          rm -rf .rollback-package
          mkdir -p .rollback-package
          cp -R rollback-src/wp-content/plugins/madagaskar-management-center .rollback-package/madagaskar-management-center
          cp -R rollback-src/wp-content/plugins/madagaskar-okul-tanitim .rollback-package/madagaskar-okul-tanitim
          (cd .rollback-package && zip -qr ../deploy/ROLLBACK-madagaskar-management-center-1.3.48.zip madagaskar-management-center)
          (cd .rollback-package && zip -qr ../deploy/ROLLBACK-madagaskar-okul-tanitim-1.8.1.zip madagaskar-okul-tanitim)

          unzip -t deploy/madagaskar-management-center-1.3.48.zip
          unzip -t deploy/madagaskar-okul-tanitim-1.8.4.zip
          unzip -t deploy/ROLLBACK-madagaskar-management-center-1.3.48.zip
          unzip -t deploy/ROLLBACK-madagaskar-okul-tanitim-1.8.1.zip
          sha256sum deploy/*.zip > deploy/SHA256SUMS.txt

      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: mmc-school-deployment
          path: |
            deploy/madagaskar-management-center-1.3.48.zip
            deploy/madagaskar-okul-tanitim-1.8.4.zip
            deploy/ROLLBACK-madagaskar-management-center-1.3.48.zip
            deploy/ROLLBACK-madagaskar-okul-tanitim-1.8.1.zip
            deploy/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
