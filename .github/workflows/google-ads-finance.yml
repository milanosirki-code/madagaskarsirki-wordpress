name: Google Ads Finance
on:
  push:
    paths: ['wp-content/plugins/mdg-google-ads-finance/**', 'tests/google-ads-finance/**', '.github/workflows/google-ads-finance.yml']
  pull_request:
    paths: ['wp-content/plugins/mdg-google-ads-finance/**', 'tests/google-ads-finance/**', '.github/workflows/google-ads-finance.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl
      - run: php -l wp-content/plugins/mdg-google-ads-finance/mdg-google-ads-finance.php
      - run: php tests/google-ads-finance/contract.php
      - run: cd wp-content/plugins && zip -r ../../mdg-google-ads-finance.zip mdg-google-ads-finance
      - uses: actions/upload-artifact@v4
        with:
          name: mdg-google-ads-finance-php-${{ matrix.php }}
          path: mdg-google-ads-finance.zip
