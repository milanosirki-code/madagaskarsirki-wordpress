name: Corporate campaign contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  corporate-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: php -l docs/code-snippets/mdg-corporate-campaigns.php
      - run: php -l docs/code-snippets/mdg-campaign-sales-report.php
      - run: php tests/corporate-invitation/dynamic-catalogue.php
      - run: php tests/corporate-invitation/sales-report.php
      - run: php tests/corporate-invitation/live-price-menu.php
      - run: php tests/corporate-invitation/multi-province-admin.php
      - run: php -l wp-content/plugins/milano-sagliksen/milano-sagliksen.php
      - run: php -l wp-content/plugins/milano-sagliksen/view.php
      - run: php -l wp-content/plugins/milano-shared-checkout-handoff/milano-shared-checkout-handoff.php
      - run: php tests/corporate-invitation/milano-sagliksen.php
      - run: php tests/corporate-invitation/handoff-designer.php
      - run: php tests/corporate-invitation/stage-content.php
      - run: php -l wp-content/plugins/milano-corporate-campaigns/engine.php
      - run: php -l wp-content/plugins/milano-corporate-campaigns/milano-corporate-campaigns.php
      - run: php -l integrations/milano/sagliksen-20261018/corporate-preview.php
      - run: php tests/corporate-invitation/milano-corporate.php
      - run: npm install --no-save jsdom@26
      - run: node tests/corporate-invitation/age-ui.cjs
      - run: node tests/corporate-invitation/milano-ui.cjs
