name: MDG Sales Adoption Identity
on:
  push:
    branches: ['fix/milano-sales-adoption-identity-20261015']
  pull_request:
    paths:
      - 'wp-content/plugins/madagaskar-bilet-yonetimi/includes/class-mdg-sales-adopter.php'
      - 'tests/mdg/sales-adoption-identity.php'
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l wp-content/plugins/madagaskar-bilet-yonetimi/includes/class-mdg-sales-adopter.php
      - run: php tests/mdg/sales-adoption-identity.php
