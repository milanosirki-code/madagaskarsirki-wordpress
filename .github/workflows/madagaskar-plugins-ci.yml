name: Madagaskar Plugins CI

on:
  pull_request:
    paths:
      - 'wp-content/plugins/madagaskar-management-center/**'
      - 'wp-content/plugins/madagaskar-aile-paketi-22/**'
      - 'wp-content/plugins/madagaskar-okul-tanitim/**'
      - 'wp-content/plugins/madagaskar-population-data/**'
      - '.github/workflows/madagaskar-plugins-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'wp-content/plugins/madagaskar-management-center/**'
      - 'wp-content/plugins/madagaskar-aile-paketi-22/**'
      - 'wp-content/plugins/madagaskar-okul-tanitim/**'
      - 'wp-content/plugins/madagaskar-population-data/**'
      - '.github/workflows/madagaskar-plugins-ci.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          for dir in             wp-content/plugins/madagaskar-management-center             wp-content/plugins/madagaskar-aile-paketi-22             wp-content/plugins/madagaskar-okul-tanitim             wp-content/plugins/madagaskar-population-data
          do
            test -d "$dir"
            find "$dir" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          done
      - name: Verify canonical plugin versions
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'Version:[[:space:]]*1\.3\.36' wp-content/plugins/madagaskar-management-center/madagaskar-management-center.php
          grep -Eq 'Version:[[:space:]]*1\.1\.3' wp-content/plugins/madagaskar-aile-paketi-22/madagaskar-aile-paketi-22.php
          grep -Eq "mmc_family_price_for_event" wp-content/plugins/madagaskar-aile-paketi-22/madagaskar-aile-paketi-22.php
          grep -Eq "2 çocuk \+ 2 yetişkin" wp-content/plugins/madagaskar-aile-paketi-22/madagaskar-aile-paketi-22.php
          grep -Eq "class MMC_Navigation_Admin" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-prep-region-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-sales-customer-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-system-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mdg_destination" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-marketing-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-kommo-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-finance-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "hidden_detail_pages" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "admin_menu_cleanup_js" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "tickera_status" wp-content/plugins/madagaskar-management-center/includes/class-mmc-health-service.php
          grep -Eq "WooCommerce → MDG → Tickera Zinciri" wp-content/plugins/madagaskar-management-center/includes/class-mmc-health-service.php
          grep -Eq "MMC_Snippet_Inventory_Service" wp-content/plugins/madagaskar-management-center/includes/class-mmc-snippet-inventory-service.php\n          grep -Eq "Snippet Envanteri & Çakışma Merkezi" wp-content/plugins/madagaskar-management-center/includes/class-mmc-snippet-inventory-admin.php\n          grep -Eq "MMC_Snippet_Inventory_Service::health_check" wp-content/plugins/madagaskar-management-center/includes/class-mmc-health-service.php
          grep -Eq "connection_diagnostics" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "pipeline_diagnostics" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "pipeline_catalog" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "discover_pipeline_selection" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "mmc_kommo_refresh_catalog" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-admin.php
          grep -Eq "install_program_pipeline" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "admin_write_readiness" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "record_pipeline_install_result" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "_embedded.*statuses" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "status_bridge_preview" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "preserve_ahead" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "Kommo Program Durum Köprüsü" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-admin.php
          grep -Eq "queue_health" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "is_retryable_error" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "FAST_CRON_HOOK" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "header_remove.*X-Robots-Tag" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "source_delivery_diagnostics" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "build_source_html" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "create_direct_text_source" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "token_migration_diagnostics" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "navigation_health" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "madagaskar-v4" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "madagaskar-etkinlik-yayinla" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "legacy_bilet_items_for" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "quick_confirm_master_venue" wp-content/plugins/madagaskar-management-center/includes/class-mmc-venue-service.php
          grep -Eq "venue_candidates_for_program" wp-content/plugins/madagaskar-management-center/includes/class-mmc-venue-service.php
          grep -Eq "mmc_quick_confirm_venue" wp-content/plugins/madagaskar-management-center/includes/class-mmc-event-admin.php
          grep -Eq "create_draft_from_program" wp-content/plugins/madagaskar-management-center/includes/class-mmc-mdg-bridge-service.php
          grep -Eq "MMC Programından Etkinlik Taslağı" wp-content/plugins/madagaskar-management-center/includes/class-mmc-mdg-publish-admin.php
          grep -Eq "mmc_create_mdg_draft" wp-content/plugins/madagaskar-management-center/includes/class-mmc-mdg-publish-admin.php
          grep -Eq "MMC_MDG_Draft_Sync_Service" wp-content/plugins/madagaskar-management-center/includes/class-mmc-mdg-draft-sync-service.php
          grep -Eq "family_2_2.*continue" wp-content/plugins/madagaskar-management-center/includes/class-mmc-mdg-draft-sync-service.php
          grep -Eq "sync_family_package_option" wp-content/plugins/madagaskar-management-center/includes/class-mmc-mdg-draft-sync-service.php
          grep -Eq "\{\{ADRES\}\}" wp-content/plugins/madagaskar-management-center/includes/class-mmc-publish-content-excel.php
          grep -Eq "\{\{BILET_OZETI\}\}" wp-content/plugins/madagaskar-management-center/includes/class-mmc-publish-content-excel.php
          grep -Eq "mmc_sync_mdg_draft" wp-content/plugins/madagaskar-management-center/includes/class-mmc-event-admin.php
          grep -Eq "Yayın İçeriği Excel" wp-content/plugins/madagaskar-management-center/includes/class-mmc-publish-content-excel.php
          grep -Eq "mmc_download_publish_content_template" wp-content/plugins/madagaskar-management-center/includes/class-mmc-publish-content-excel.php
          grep -Eq "mmc_import_publish_content" wp-content/plugins/madagaskar-management-center/includes/class-mmc-publish-content-excel.php
          grep -Eq "Aile Paketi 2\+2" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "Kesin Salonu Hemen Bağla" wp-content/plugins/madagaskar-management-center/includes/class-mmc-event-admin.php
          grep -Eq "runtime_token_choice" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "Kommo Token Geçiş Merkezi" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-admin.php
          grep -Eq "account_mismatch" wp-content/plugins/madagaskar-management-center/includes/class-mmc-health-service.php
          grep -Eq "api/v2/sources/text" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "MMC TEXT SOURCE KUR" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-admin.php
          grep -Eq "direct-text" wp-content/plugins/madagaskar-management-center/includes/class-mmc-integrity-service.php
          grep -Eq "text/html; charset=utf-8" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "source_delivery_last_hit" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "semantik HTML" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-admin.php
          grep -Eq "crawler-okunabilir" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-admin.php
          grep -Eq "Aşama .*→" wp-content/plugins/madagaskar-management-center/includes/class-mmc-integrity-service.php
          grep -Eq "Son Kurulum Denemesi" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-admin.php
          grep -Eq "MMC PROGRAM PIPELINE KUR" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-admin.php
          grep -Eq "MMC Program Pipeline Şeması" wp-content/plugins/madagaskar-management-center/includes/class-mmc-health-service.php
          grep -Eq "MS_KOMMO_TOKEN" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          ! grep -Eq "remove_submenu_page\( .mmc-dashboard" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq 'Version:[[:space:]]*1\.7\.9' wp-content/plugins/madagaskar-okul-tanitim/madagaskar-okul-tanitim.php
          grep -Eq 'Version:[[:space:]]*1\.3\.1' wp-content/plugins/madagaskar-population-data/madagaskar-population-data.php


      - name: Package integrity plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (
            cd wp-content/plugins
            zip -qr ../../dist/madagaskar-management-center-v1.3.36.zip madagaskar-management-center
            zip -qr ../../dist/madagaskar-aile-paketi-22-v1.1.3.zip madagaskar-aile-paketi-22
            zip -qr ../../dist/madagaskar-okul-tanitim-v1.7.9.zip madagaskar-okul-tanitim -x "madagaskar-okul-tanitim/data/schools.csv"
          )
          unzip -t dist/madagaskar-management-center-v1.3.36.zip
          unzip -t dist/madagaskar-aile-paketi-22-v1.1.3.zip
          unzip -t dist/madagaskar-okul-tanitim-v1.7.9.zip

      - name: Upload program-integrity packages
        uses: actions/upload-artifact@v4
        with:
          name: madagaskar-program-integrity-packages
          path: |
            dist/madagaskar-management-center-v1.3.36.zip
            dist/madagaskar-okul-tanitim-v1.7.9.zip
          if-no-files-found: error
