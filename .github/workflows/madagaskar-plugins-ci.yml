name: Madagaskar Plugins CI

on:
  pull_request:
    paths:
      - 'wp-content/plugins/madagaskar-management-center/**'
      - 'wp-content/plugins/madagaskar-okul-tanitim/**'
      - 'wp-content/plugins/madagaskar-population-data/**'
      - '.github/workflows/madagaskar-plugins-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'wp-content/plugins/madagaskar-management-center/**'
      - 'wp-content/plugins/madagaskar-okul-tanitim/**'
      - 'wp-content/plugins/madagaskar-population-data/**'
      - '.github/workflows/madagaskar-plugins-ci.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          for dir in             wp-content/plugins/madagaskar-management-center             wp-content/plugins/madagaskar-okul-tanitim             wp-content/plugins/madagaskar-population-data
          do
            test -d "$dir"
            find "$dir" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          done
      - name: Verify canonical plugin versions
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'Version:[[:space:]]*1\.3\.15' wp-content/plugins/madagaskar-management-center/madagaskar-management-center.php
          grep -Eq "class MMC_Navigation_Admin" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-prep-region-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-sales-customer-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-system-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mdg_destination" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-marketing-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-kommo-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "mmc-finance-hub" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "hidden_detail_pages" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "admin_menu_cleanup_js" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq "tickera_status" wp-content/plugins/madagaskar-management-center/includes/class-mmc-health-service.php
          grep -Eq "WooCommerce → MDG → Tickera Zinciri" wp-content/plugins/madagaskar-management-center/includes/class-mmc-health-service.php
          grep -Eq "MMC_Snippet_Inventory_Service" wp-content/plugins/madagaskar-management-center/includes/class-mmc-snippet-inventory-service.php\n          grep -Eq "Snippet Envanteri & Çakışma Merkezi" wp-content/plugins/madagaskar-management-center/includes/class-mmc-snippet-inventory-admin.php\n          grep -Eq "MMC_Snippet_Inventory_Service::health_check" wp-content/plugins/madagaskar-management-center/includes/class-mmc-health-service.php
          grep -Eq "connection_diagnostics" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "pipeline_diagnostics" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "pipeline_catalog" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "discover_pipeline_selection" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          grep -Eq "mmc_kommo_refresh_catalog" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-admin.php
          grep -Eq "MS_KOMMO_TOKEN" wp-content/plugins/madagaskar-management-center/includes/class-mmc-kommo-service.php
          ! grep -Eq "remove_submenu_page\( .mmc-dashboard" wp-content/plugins/madagaskar-management-center/includes/class-mmc-navigation-admin.php
          grep -Eq 'Version:[[:space:]]*1\.7\.4' wp-content/plugins/madagaskar-okul-tanitim/madagaskar-okul-tanitim.php
          grep -Eq 'Version:[[:space:]]*1\.3\.1' wp-content/plugins/madagaskar-population-data/madagaskar-population-data.php


      - name: Package integrity plugins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (
            cd wp-content/plugins
            zip -qr ../../dist/madagaskar-management-center-v1.3.15.zip madagaskar-management-center
            zip -qr ../../dist/madagaskar-okul-tanitim-v1.7.4.zip madagaskar-okul-tanitim -x "madagaskar-okul-tanitim/data/schools.csv"
          )
          unzip -t dist/madagaskar-management-center-v1.3.15.zip
          unzip -t dist/madagaskar-okul-tanitim-v1.7.4.zip

      - name: Upload program-integrity packages
        uses: actions/upload-artifact@v4
        with:
          name: madagaskar-program-integrity-packages
          path: |
            dist/madagaskar-management-center-v1.3.15.zip
            dist/madagaskar-okul-tanitim-v1.7.4.zip
          if-no-files-found: error
