name: Gemini intake safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php -l wp-content/plugins/mdg-gemini-intake/mdg-gemini-intake.php
      - run: php -d error_reporting=E_ALL tests/gemini-intake.php
      - run: php tests/web-assistant-core/run.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check wp-content/plugins/mdg-gemini-intake/intake.js
      - run: npm install --prefix "$RUNNER_TEMP/mdg-web-ui" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - run: NODE_PATH="$RUNNER_TEMP/mdg-web-ui/node_modules" node tests/gemini-intake-ui.cjs
