name: WordPress.com Issue 182 Legacy Redirects artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wpcom-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: php -l wp-content/plugins/madagaskar-legacy-redirects/madagaskar-legacy-redirects.php
      - run: php tests/legacy-redirects/contract.php
      - run: python3 tests/issue-182/catalog-safety.py
      - name: Stage exactly one plugin file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wpcom-deploy
          cp wp-content/plugins/madagaskar-legacy-redirects/madagaskar-legacy-redirects.php wpcom-deploy/
          test "$(find wpcom-deploy -type f | wc -l)" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: wpcom
          path: wpcom-deploy/
          retention-days: 1
          if-no-files-found: error
