name: Ticket datetime canonical staging checks
on:
  pull_request:
    paths:
      - 'docs/code-snippets/issue-98/**'
      - 'wp-content/plugins/madagaskar-bilet-yonetimi/**'
      - 'tests/ticket-datetime/**'
      - '.github/workflows/ticket-datetime-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint staged canonical module and tests
        run: |
          php -l wp-content/plugins/madagaskar-bilet-yonetimi/includes/class-mdg-ticket-session-datetime.php
          php -l tests/ticket-datetime/regression.php
          find wp-content/plugins/madagaskar-bilet-yonetimi -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run isolated session and PDF-input regressions
        run: php tests/ticket-datetime/regression.php
