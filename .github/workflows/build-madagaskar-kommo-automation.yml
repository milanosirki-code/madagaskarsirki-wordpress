name: Build Madagaskar Kommo Automation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wp-content/plugins/madagaskar-kommo-automation/**'
      - '.github/workflows/build-madagaskar-kommo-automation.yml'
  push:
    branches:
      - main
    paths:
      - 'wp-content/plugins/madagaskar-kommo-automation/**'
      - '.github/workflows/build-madagaskar-kommo-automation.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Lint plugin PHP
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/madagaskar-kommo-automation -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate manifest and secret policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('wp-content/plugins/madagaskar-kommo-automation')
          manifest = json.loads((root / 'migration-manifest.json').read_text(encoding='utf-8'))
          assert manifest['plugin']['slug'] == 'madagaskar-kommo-automation'
          assert manifest['plugin']['source_version'] == '0.1.1'

          php = '\n'.join(p.read_text(encoding='utf-8') for p in root.rglob('*.php'))

          jwt = re.compile(r'\beyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}\b')
          assert not jwt.search(php), 'JWT-like credential literal detected in plugin PHP'

          hardcoded = re.compile(
              r"define\s*\(\s*['\"]MS_KOMMO_TOKEN['\"]\s*,\s*['\"][^'\"]+['\"]",
              re.I,
          )
          assert not hardcoded.search(php), 'Hard-coded MS_KOMMO_TOKEN detected'

          bootstrap = (root / 'madagaskar-kommo-automation.php').read_text(encoding='utf-8')
          ticket = (root / 'modules/automatic-ticket-link.php').read_text(encoding='utf-8')
          assert "get_option( 'mmc_kommo_runtime_token'" in bootstrap
          assert "define( 'MMC_KOMMO_TOKEN', $mdg_kommo_runtime_token )" in bootstrap
          assert "function ms_kommo_token_value()" in ticket
          assert "'Bearer ' . ms_kommo_token_value()" in ticket

          print('Kommo automation package policy OK')
          PY

      - name: Build ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/madagaskar-kommo-automation
          cp -R wp-content/plugins/madagaskar-kommo-automation/. build/madagaskar-kommo-automation/
          (
            cd build
            zip -r -q madagaskar-kommo-automation.zip madagaskar-kommo-automation
            sha256sum madagaskar-kommo-automation.zip > madagaskar-kommo-automation.zip.sha256
          )

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: madagaskar-kommo-automation
          path: |
            build/madagaskar-kommo-automation.zip
            build/madagaskar-kommo-automation.zip.sha256
          if-no-files-found: error
          retention-days: 30
