name: WordPress.com MMC 1.3.49 artifact

on:
  push:
    branches:
      - main
      - chatgpt/mmc-1349-deploy-20261008
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wpcom-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none

      - name: Lint MMC plugin
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/madagaskar-management-center -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Verify MMC release version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Version: 1.3.49' wp-content/plugins/madagaskar-management-center/madagaskar-management-center.php
          grep -Fq "define( 'MMC_VERSION', '1.3.49' );" wp-content/plugins/madagaskar-management-center/madagaskar-management-center.php

      - name: Sales regressions
        shell: bash
        run: |
          set -euo pipefail
          php -d error_reporting=E_ALL tests/mmc-sales/gross-revenue.php
          php -d error_reporting=E_ALL tests/mmc-sales/refund-object-guard.php

      - name: Stage complete MMC plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wpcom-deploy
          mkdir -p wpcom-deploy
          cp -R wp-content/plugins/madagaskar-management-center/. wpcom-deploy/
          diff -qr wp-content/plugins/madagaskar-management-center wpcom-deploy
          test -f wpcom-deploy/madagaskar-management-center.php
          test -f wpcom-deploy/includes/class-mmc-sales-service.php

      - uses: actions/upload-artifact@v4
        with:
          name: wpcom
          path: wpcom-deploy/
          retention-days: 1
          if-no-files-found: error
