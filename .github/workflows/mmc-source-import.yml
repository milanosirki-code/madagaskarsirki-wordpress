name: Import MMC 1.3.3 source

on:
  push:
    branches:
      - sync/mmc-1.3.3-source
    paths:
      - .github/workflows/mmc-source-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .mmc-import/part-00.b64
            cat .mmc-import/gap-*.b64
            cat .mmc-import/part-01-*.b64
          } | tr -d '\r\n' | base64 -d > /tmp/mmc.tar.xz
          echo "e77dff744be5426c5cbcd322939b8776fba71c9a588a72af0e2725ccff44102c  /tmp/mmc.tar.xz" | sha256sum -c -
          mkdir -p /tmp/mmc-src
          tar -xJf /tmp/mmc.tar.xz -C /tmp/mmc-src
          test -f /tmp/mmc-src/madagaskar-management-center/madagaskar-management-center.php
          grep -q "Version: 1.3.3" /tmp/mmc-src/madagaskar-management-center/madagaskar-management-center.php

      - name: Install MMC source into repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wp-content/plugins/madagaskar-management-center
          mkdir -p wp-content/plugins
          cp -a /tmp/mmc-src/madagaskar-management-center wp-content/plugins/madagaskar-management-center
          rm -rf .mmc-import
          rm -f .github/workflows/mmc-source-import.yml

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          test "$(find wp-content/plugins/madagaskar-management-center -name '*.php' | wc -l)" -eq 29
          find wp-content/plugins/madagaskar-management-center -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "madagaskar-github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Madagaskar Management Center v1.3.3 source"
          git push origin HEAD:sync/mmc-1.3.3-source
