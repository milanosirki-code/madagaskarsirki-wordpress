name: Production Source Archive
on:
  pull_request:
    paths:
      - 'docs/code-snippets/production/**'
      - 'docs/live-captures/2026-10-04/plugin-versions/**'
      - 'docs/STAGE4_SOURCE_INVENTORY_20261004.json'
      - 'tests/validate-production-source-archive.py'
      - '.github/workflows/production-source-archive.yml'
      - 'wp-content/plugins/**'
permissions:
  contents: read
jobs:
  archive-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Verify exact source hashes and lint without executing production code
        run: python3 tests/validate-production-source-archive.py --lint
