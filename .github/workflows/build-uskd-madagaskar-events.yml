name: Build USKD Madagaskar Events

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integrations/uskd/uskd-madagaskar-events/**'
      - 'integrations/uskd/deployment-manifest.json'
      - 'tests/validate-uskd-madagaskar-events.py'
      - '.github/workflows/build-uskd-madagaskar-events.yml'
  push:
    branches:
      - main
    paths:
      - 'integrations/uskd/uskd-madagaskar-events/**'
      - 'integrations/uskd/deployment-manifest.json'
      - 'tests/validate-uskd-madagaskar-events.py'
      - '.github/workflows/build-uskd-madagaskar-events.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Lint plugin PHP
        shell: bash
        run: |
          set -euo pipefail
          find integrations/uskd/uskd-madagaskar-events -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate deployment contract
        run: python tests/validate-uskd-madagaskar-events.py

      - name: Build ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/uskd-madagaskar-events
          cp -R integrations/uskd/uskd-madagaskar-events/. build/uskd-madagaskar-events/
          (
            cd build
            zip -r -q uskd-madagaskar-events.zip uskd-madagaskar-events
            sha256sum uskd-madagaskar-events.zip > uskd-madagaskar-events.zip.sha256
          )

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: uskd-madagaskar-events
          path: |
            build/uskd-madagaskar-events.zip
            build/uskd-madagaskar-events.zip.sha256
          if-no-files-found: error
          retention-days: 30
