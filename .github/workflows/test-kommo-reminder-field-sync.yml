name: Test Kommo Reminder Fields
on:
  pull_request:
    paths:
      - 'prototypes/payment-reminder/kommo-reminder-field-sync.php'
      - 'tests/payment-reminder/kommo-field-sync.php'
      - '.github/workflows/test-kommo-reminder-field-sync.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: php -l prototypes/payment-reminder/kommo-reminder-field-sync.php
      - run: php tests/payment-reminder/kommo-field-sync.php
      - run: php tests/payment-reminder/regression.php
