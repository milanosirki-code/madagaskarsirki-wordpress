name: Kommo source HTTP contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  kommo-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
      - run: python3 tests/kommo-source/http-status.py
      - run: python3 tests/kommo-source/family-fallback-static.py
