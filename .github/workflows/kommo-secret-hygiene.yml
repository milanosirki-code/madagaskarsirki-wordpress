name: Kommo secret hygiene

on:
  push:
    branches:
      - main
      - chatgpt/kommo-secret-hygiene-166-20261007
  pull_request:
    paths:
      - 'wp-content/plugins/**'
      - 'docs/code-snippets/**'
      - 'tests/security/kommo-secret-hygiene.py'
      - 'tests/security/snippet-42-token-migration.php'
      - 'prototypes/security/snippet-42-mmc-token-migration.php'
      - 'docs/SNIPPET_42_MMC_TOKEN_MIGRATION_192.md'
      - '.github/workflows/kommo-secret-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tests/security/kommo-secret-hygiene.py
      - run: php -l prototypes/security/snippet-42-mmc-token-migration.php
      - run: php -l tests/security/snippet-42-token-migration.php
      - run: php tests/security/snippet-42-token-migration.php
