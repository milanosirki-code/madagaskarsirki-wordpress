name: School data and route PDF checks

on:
  pull_request:
    paths:
      - 'wp-content/plugins/madagaskar-okul-tanitim/**'
      - 'wp-content/plugins/madagaskar-management-center/includes/class-mmc-school-source-service.php'
      - 'wp-content/plugins/madagaskar-management-center/includes/class-mmc-region-service.php'
      - 'wp-content/plugins/madagaskar-management-center/includes/class-mmc-admin.php'
      - 'tests/schools/**'
      - '.github/workflows/school-data-route.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP syntax
        run: |
          php -l wp-content/plugins/madagaskar-okul-tanitim/madagaskar-okul-tanitim.php
          php -l wp-content/plugins/madagaskar-okul-tanitim/includes/class-mad-okul-operations.php
          php -l wp-content/plugins/madagaskar-management-center/includes/class-mmc-school-source-service.php
          php -l wp-content/plugins/madagaskar-management-center/includes/class-mmc-region-service.php
          php -l wp-content/plugins/madagaskar-management-center/includes/class-mmc-admin.php
      - name: Contract
        run: php tests/schools/student-count-route-pdf-contract.php
