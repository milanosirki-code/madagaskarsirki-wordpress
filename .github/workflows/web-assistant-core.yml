name: Web Assistant Core
on:
  pull_request:
    paths:
      - 'wp-content/plugins/madagaskar-web-assistant-core/**'
      - 'tests/web-assistant-core/**'
      - '.github/workflows/web-assistant-core.yml'
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/madagaskar-web-assistant-core/**'
      - 'tests/web-assistant-core/**'
      - '.github/workflows/web-assistant-core.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - name: PHP syntax
        run: find wp-content/plugins/madagaskar-web-assistant-core tests/web-assistant-core -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Behaviour, independent optimality oracle and no-write adapter tests
        run: php -d error_reporting=E_ALL -d display_errors=1 tests/web-assistant-core/run.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check wp-content/plugins/madagaskar-web-assistant-core/assets/preview.js
      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/mdg-web-ui" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: UI and request lifecycle
        run: NODE_PATH="$RUNNER_TEMP/mdg-web-ui/node_modules" node tests/web-assistant-core/ui.cjs
