name: Legacy redirect contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  legacy-redirects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: php -l wp-content/plugins/madagaskar-legacy-redirects/madagaskar-legacy-redirects.php
      - run: php tests/legacy-redirects/contract.php
