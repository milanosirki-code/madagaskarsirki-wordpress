name: Raffle replacement contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  replacement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: php -l docs/code-snippets/madagaskar-raffle-replacement.php
      - run: php tests/raffle/replacement.php
