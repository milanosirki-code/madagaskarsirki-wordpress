name: Okul Plugin CI

on:
  pull_request:
    paths:
      - "plugins/madagaskar-okul-tanitim/**"
      - ".github/workflows/okul-plugin-ci.yml"
  push:
    branches:
      - main
      - develop/okul-yonetimi
    paths:
      - "plugins/madagaskar-okul-tanitim/**"
      - ".github/workflows/okul-plugin-ci.yml"

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: PHP 8.2 hazırla
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: PHP sözdizimini denetle
        run: find plugins/madagaskar-okul-tanitim -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Kurulum ZIP paketini oluştur
        run: |
          mkdir -p dist
          cd plugins
          zip -r ../dist/madagaskar-okul-tanitim-v1.7.3.zip madagaskar-okul-tanitim \
            -x "madagaskar-okul-tanitim/data/schools.csv"

      - name: Paketi iş akışı çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: madagaskar-okul-tanitim-v1.7.3
          path: dist/madagaskar-okul-tanitim-v1.7.3.zip
          if-no-files-found: error
