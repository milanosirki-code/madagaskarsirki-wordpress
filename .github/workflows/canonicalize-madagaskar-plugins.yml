name: Canonicalize Madagaskar plugin sources

on:
  push:
    branches:
      - sync/canonical-plugin-layout-20260923

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Expand MMC v1.3.4 and apply v1.3.5 overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mmc-bootstrap
          mkdir -p /tmp/mmc-bootstrap
          unzip -q .bootstrap/madagaskar-management-center-v1.3.4.zip -d /tmp/mmc-bootstrap
          test -f /tmp/mmc-bootstrap/madagaskar-management-center/madagaskar-management-center.php
          rm -rf wp-content/plugins/madagaskar-management-center
          mkdir -p wp-content/plugins
          mv /tmp/mmc-bootstrap/madagaskar-management-center wp-content/plugins/madagaskar-management-center

          if [ -d updates/madagaskar-management-center/1.3.5 ]; then
            cp -f updates/madagaskar-management-center/1.3.5/madagaskar-management-center.php wp-content/plugins/madagaskar-management-center/madagaskar-management-center.php
            cp -f updates/madagaskar-management-center/1.3.5/README.md wp-content/plugins/madagaskar-management-center/README.md
          fi

      - name: Mirror Okul Tanıtım into canonical WordPress path
        shell: bash
        run: |
          set -euo pipefail
          test -f plugins/madagaskar-okul-tanitim/madagaskar-okul-tanitim.php
          rm -rf wp-content/plugins/madagaskar-okul-tanitim
          cp -a plugins/madagaskar-okul-tanitim wp-content/plugins/madagaskar-okul-tanitim

      - name: Validate plugin versions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Version: 1.3.5" wp-content/plugins/madagaskar-management-center/madagaskar-management-center.php
          grep -Eq "Version:[[:space:]]*1\.7\.2" wp-content/plugins/madagaskar-okul-tanitim/madagaskar-okul-tanitim.php
          grep -Eq "Version:[[:space:]]*1\.3\.1" wp-content/plugins/madagaskar-population-data/madagaskar-population-data.php

      - name: PHP lint all Madagaskar plugins
        shell: bash
        run: |
          set -euo pipefail
          find wp-content/plugins/madagaskar-management-center wp-content/plugins/madagaskar-okul-tanitim wp-content/plugins/madagaskar-population-data -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Commit canonical sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: canonicalize Madagaskar plugin source layout"
          git push origin HEAD:${{ github.ref_name }}
