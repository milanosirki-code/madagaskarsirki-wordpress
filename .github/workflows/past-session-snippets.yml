name: Past-session staged snippets checks
on:
  pull_request:
    paths:
      - 'docs/code-snippets/staged-2026-10-04/**'
      - 'tests/past-session-snippets/**'
      - '.github/workflows/past-session-snippets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint staged snippet bodies and tests
        run: |
          set -e
          for f in docs/code-snippets/staged-2026-10-04/*.php.txt; do
            tmp="$(mktemp --suffix=.php)"
            { echo '<?php'; cat "$f"; } > "$tmp"
            php -l "$tmp"
            rm -f "$tmp"
          done
          php -l tests/past-session-snippets/regression.php
      - name: Run isolated regressions
        run: |
          php tests/past-session-snippets/regression.php
          MS_TEST_DELEGATE=1 php tests/past-session-snippets/regression.php
