name: WordPress.com Family Package 1.1.3 artifact

on:
  push:
    branches:
      - chatgpt/family-package-113-deploy-20261007
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wpcom-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Lint Family Package plugin
        run: php -l wp-content/plugins/madagaskar-aile-paketi-22/madagaskar-aile-paketi-22.php
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Version: 1.1.3' wp-content/plugins/madagaskar-aile-paketi-22/madagaskar-aile-paketi-22.php
          grep -Fq "const VERSION        = '1.1.3';" wp-content/plugins/madagaskar-aile-paketi-22/madagaskar-aile-paketi-22.php
      - name: Stage exactly one runtime file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wpcom-deploy
          cp wp-content/plugins/madagaskar-aile-paketi-22/madagaskar-aile-paketi-22.php wpcom-deploy/
          test "$(find wpcom-deploy -type f | wc -l)" -eq 1
          cmp wp-content/plugins/madagaskar-aile-paketi-22/madagaskar-aile-paketi-22.php wpcom-deploy/madagaskar-aile-paketi-22.php
      - uses: actions/upload-artifact@v4
        with:
          name: wpcom
          path: wpcom-deploy/
          retention-days: 1
          if-no-files-found: error
